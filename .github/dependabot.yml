```yaml
version: 2

updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      python-dependencies:
        patterns:
          - "*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
```

### Pourquoi cette configuration

**1. Python → `pip`**

Dependabot surveillera les fichiers de dépendances Python situés à la racine du projet. `pip` est bien l'écosystème à utiliser pour les projets Python, y compris lorsque les dépendances sont gérées avec certains outils comme Poetry.

**2. GitHub Actions**

C'est particulièrement important pour Glaneur puisque ton projet utilise son CI/CD pour construire les applications. Dependabot peut également maintenir les références aux actions utilisées dans `.github/workflows/` à jour.

**3. Une vérification hebdomadaire**

Je préfère `weekly` à `daily` pour Glaneur :

* suffisamment fréquent pour les correctifs de sécurité ;
* moins de bruit dans les PR ;
* moins de risques d'avoir plusieurs mises à jour simultanées ;
* plus facile à maintenir pour un projet individuel.

**4. Maximum 5 PR ouvertes**

Cela évite que Dependabot te crée une dizaine de PR en même temps lorsqu'une nouvelle version majeure de plusieurs dépendances sort.

**5. Regroupement**

Le `groups` est intéressant ici. Si plusieurs dépendances Python ont évolué, Dependabot peut regrouper les mises à jour au lieu de créer une PR par dépendance.

Même principe pour les GitHub Actions.

---

### Structure finale

Je te conseille donc d'avoir au minimum :

```text
Glaneur/
├── .github/
│   ├── workflows/
│   │   ├── ...
│   │
│   ├── dependabot.yml
│   └── SECURITY.md
│
├── ...
```

avec :

* `SECURITY.md` → **comment signaler une vulnérabilité**
* `dependabot.yml` → **maintien automatique des dépendances**
* GitHub Actions → **tests/build/release**

Le fichier `dependabot.yml` doit être dans `.github/` de la branche par défaut pour être pris en compte.

### Une amélioration que je ferais pour Glaneur

Vu que Glaneur est une application **desktop Python avec packaging/release automatique**, je ne m'arrêterais pas à Dependabot. Je vérifierais aussi que ton dépôt a bien :

```text
Dependabot alerts
Dependabot security updates
Dependency graph
CodeQL
Secret scanning
```

Dependabot Alerts et les Security Updates se configurent en partie dans les paramètres du dépôt, indépendamment du fichier `dependabot.yml`.

Si tu veux, je peux aussi te préparer **le pack `.github/` complet de Glaneur** (`SECURITY.md` + `dependabot.yml` + workflow CodeQL + bonnes pratiques GitHub Actions), adapté précisément à ton projet et sans ajouter de complexité inutile.
