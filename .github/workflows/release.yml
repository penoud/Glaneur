name: tag-release

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never cancel a run waiting for approval or publishing: pushes queue up.
  group: release
  cancel-in-progress: false

jobs:
  tests:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/tests.yml

  version:
    needs: tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Read and validate version
        id: version
        shell: bash
        run: |
          version=$(python -c 'from Glaneur import __version__; print(__version__)')
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Invalid version: $version" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check whether this version is already released
        id: check
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          # Skip build+publish when the tag already exists: the version was
          # not bumped, and republishing would upload different bytes under
          # the same asset name.
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists; nothing to build."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.release == 'true'
    # `secrets: inherit` is needed so that the called workflow can see
    # WINDOWS_PFX_* when signing the Windows bundle and installer.
    uses: ./.github/workflows/build.yml
    secrets: inherit

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    # Required reviewers on this environment pause the run here, so the
    # installer can be downloaded and tried before anything is tagged.
    environment: release
    permissions:
      contents: write
    env:
      TAG: v${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: "*"
          path: release-assets
          merge-multiple: true
      - name: Tag the built commit
        shell: bash
        run: |
          # The approval wait can last days: re-check, and accept an existing
          # tag only if it is ours (re-run after a failed upload).
          if git fetch --quiet origin "refs/tags/$TAG:refs/tags/$TAG" 2>/dev/null; then
            target=$(git rev-parse "$TAG^{commit}")
            if [ "$target" != "$GITHUB_SHA" ]; then
              echo "Tag $TAG exists on $target, not on built commit $GITHUB_SHA" >&2
              exit 1
            fi
            echo "Tag $TAG already on $GITHUB_SHA; resuming publication."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" -m "Release $TAG"
          git push origin "$TAG"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # A dash in the tag (e.g. v1.2.0-rc.1) marks a pre-release: the
          # updater relies on GitHub's flag, not on the tag name.
          prerelease=()
          [[ "$TAG" == *-* ]] && prerelease=(--prerelease)
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              "${prerelease[@]}" \
              --title "Glaneur $TAG" \
              --notes "Automated release $TAG"
          fi
          # --clobber lets a re-run after a partial upload complete without
          # a manual asset delete: same bytes, same signature.
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" \
            release-assets/* --clobber
