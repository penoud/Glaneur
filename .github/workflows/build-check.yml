name: build-check

on:
  pull_request:
    paths:
      - "Glaneur/**"
      - "app.py"
      - "cli.py"
      - "build/**"
      - "requirements.txt"
      - ".github/workflows/build-check.yml"

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller build\Glaneur.spec --noconfirm --clean
      - name: Smoke test the bundle
        # The exe is windowed (`console=False`): launched directly it returns
        # at once and its exit code is lost. `Start-Process -Wait -PassThru`
        # waits for it to quit and exposes `ExitCode`, which
        # `--controle-bundle` sets to 0 when all critical imports succeed.
        shell: pwsh
        run: |
          $p = Start-Process "dist\Glaneur\Glaneur.exe" `
                 -ArgumentList "--controle-bundle" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Bundle check failed: exit code $($p.ExitCode)" }

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Qt runtime system libraries
        # PySide6 bundled by PyInstaller still dlopens system Qt runtime
        # deps (libEGL, libGL, libxkbcommon, libxcb-*, libdbus). The
        # bare ubuntu-22.04 runner has none of them, so the bundle fails
        # at import before `--controle-bundle` even runs. These are the
        # same minimal set the Debian package declares as `Depends:`.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libdbus-1-3 libfontconfig1
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller build/Glaneur.spec --noconfirm --clean
      - name: Smoke test the bundle
        # `--controle-bundle` short-circuits before any QApplication is
        # built, so no display is needed. QT_QPA_PLATFORM=offscreen keeps
        # Qt from probing the X server if a transitive import touches it.
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./dist/Glaneur/Glaneur --controle-bundle
