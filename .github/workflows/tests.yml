name: tests

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  # Sur une PR, un nouveau push rend l'exécution précédente sans intérêt.
  # `head_ref` est vide en `workflow_call` (appel depuis un push) : on
  # retombe sur `run_id` pour isoler chaque exécution de release.
  group: tests-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Qt runtime libs (offscreen)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile translations
        # Sans cette étape, translations/*.qm n'existe pas dans le
        # checkout (les .qm sont gitignored) et le test end-to-end de
        # `Glaneur.i18n.installer_traducteur` ne peut pas charger le
        # vrai fichier. Même logique que dans `build.yml`.
        run: python translations/build_translations.py release
      # Coverage is measured on Linux only: config_dir() has
      # OS-specific branches whose reachability flips between Linux and
      # Windows, so a shared floor would be either loose or falsely red.
      # Windows still runs the full suite (next step) to catch OS-specific
      # regressions; the ratchet lives on Linux where the measurement is
      # stable.
      - name: Run tests with coverage
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q --cov=Glaneur --cov-branch

      - name: Run tests
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Check per-module coverage floors
        if: runner.os == 'Linux'
        run: python tools/check_coverage.py
