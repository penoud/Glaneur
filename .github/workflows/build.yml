name: builds
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller build\WpImageDownloader.spec --noconfirm --clean
      - name: Sign application when certificate is configured
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_PFX_BASE64)) {
            Write-Warning "WINDOWS_PFX_BASE64 is not configured; the Windows build will be unsigned."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "WpImagerDownloader.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
            Sort-Object FullName -Descending | Select-Object -First 1
          if ($null -eq $signtool) { throw "signtool.exe was not found on the runner." }
          & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfx /p $env:WINDOWS_PFX_PASSWORD "dist\WpImagerDownloader\WpImagerDownloader.exe"
          Remove-Item $pfx -Force
      - run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          $version = (python -c "from WpImageDownloader import __version__; print(__version__)").Trim()
          iscc "/DMaVersion=$version" build\installer.iss
      - name: Sign installer when certificate is configured
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_PFX_BASE64)) { exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP "WpImagerDownloader.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
            Sort-Object FullName -Descending | Select-Object -First 1
          if ($null -eq $signtool) { throw "signtool.exe was not found on the runner." }
          $installer = Get-ChildItem "build\Output\WpImagerDownloader-*-setup.exe" | Select-Object -First 1
          if ($null -eq $installer) { throw "The Windows installer was not found." }
          & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfx /p $env:WINDOWS_PFX_PASSWORD $installer.FullName
          Remove-Item $pfx -Force
      - name: Generate Windows checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem "build\Output\WpImagerDownloader-*-setup.exe" | Select-Object -First 1
          if ($null -eq $installer) { throw "The Windows installer was not found." }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content "$($installer.FullName).sha256" -NoNewline
      - uses: actions/upload-artifact@v5
        with:
          name: WpImagerDownloader-setup
          path: build/Output/*

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build application bundle
        run: python -m PyInstaller build/WpImageDownloader.spec --noconfirm --clean
      - name: Build Debian package
        run: |
          chmod +x packaging/linux/build-deb.sh packaging/linux/WpImageDownloader-launcher
          packaging/linux/build-deb.sh "${GITHUB_REF_NAME#v}"
      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak --system remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak --system install -y flathub org.freedesktop.Sdk//24.08 org.freedesktop.Platform//24.08
      - name: Build Flatpak bundle
        run: |
          flatpak-builder --disable-rofiles-fuse --force-clean \
            --repo=flatpak-repo flatpak-build \
            packaging/linux/org.wpimagedownloader.WpImageDownloader.yml
          flatpak build-bundle flatpak-repo \
            "dist/WpImageDownloader-${GITHUB_REF_NAME#v}.flatpak" \
            org.wpimagedownloader.WpImageDownloader
      - name: Generate Linux checksums
        run: sha256sum dist/*.deb dist/*.flatpak > dist/SHA256SUMS-linux
      - uses: actions/upload-artifact@v5
        with:
          name: WpImageDownloader-linux
          path: |
            dist/*.deb
            dist/*.flatpak
            dist/SHA256SUMS-linux

  macos:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build macOS application
        run: python -m PyInstaller build/WpImageDownloader-macos.spec --noconfirm --clean
      - name: Create macOS archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          ditto -c -k --sequesterRsrc --keepParent \
            dist/WpImageDownloader.app "dist/WpImageDownloader-${VERSION}-macos.zip"
          hdiutil create -volname "WP Image Downloader" -srcfolder \
            dist/WpImageDownloader.app -ov -format UDZO \
            "dist/WpImageDownloader-${VERSION}-macos.dmg"
      - name: Generate macOS checksums
        run: shasum -a 256 dist/*.zip dist/*.dmg > dist/SHA256SUMS-macos

      - uses: actions/upload-artifact@v5
        with:
          name: WpImageDownloader-macos
          path: |
            dist/*.zip
            dist/*.dmg
            dist/SHA256SUMS-macos

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: "*"
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "WpImageDownloader $GITHUB_REF_NAME" \
              --notes "Automated release $GITHUB_REF_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            release-assets/* --clobber
