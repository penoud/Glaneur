name: builds
on:
  # Called by release.yml after tests pass and a fresh version is
  # detected; the caller passes WINDOWS_PFX_* through `secrets: inherit`.
  workflow_call:
  # Direct dispatch produces an installer artifact from any branch,
  # without tagging or publishing anything.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pyinstaller
      - name: Compile translations
        # Sans cette étape, translations/*.qm est vide et le .spec ne
        # bundle aucun fichier de traduction — l'app tourne alors en FR
        # même quand Config.langue vaut "en".
        run: python translations\build_translations.py release
      - run: pyinstaller build\Glaneur.spec --noconfirm --clean
      - name: Smoke test the bundle
        # Catch import failures (a module dropped by QT_INUTILES, a missing
        # hidden import) before spending time on signing and installer
        # packaging. Windowed exe: launched directly it returns at once and
        # its exit code is lost; Start-Process -Wait -PassThru exposes it.
        shell: pwsh
        run: |
          $p = Start-Process "dist\Glaneur\Glaneur.exe" `
                 -ArgumentList "--controle-bundle" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Bundle check failed: exit code $($p.ExitCode)" }
      - name: Sign application when certificate is configured
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_PFX_BASE64)) {
            Write-Warning "WINDOWS_PFX_BASE64 is not configured; the Windows build will be unsigned."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "Glaneur.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
            Sort-Object FullName -Descending | Select-Object -First 1
          if ($null -eq $signtool) { throw "signtool.exe was not found on the runner." }
          & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfx /p $env:WINDOWS_PFX_PASSWORD "dist\Glaneur\Glaneur.exe"
          Remove-Item $pfx -Force
      - run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          $version = (python -c "from Glaneur import __version__; print(__version__)").Trim()
          iscc "/DMaVersion=$version" build\installer.iss
      - name: Sign installer when certificate is configured
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_PFX_BASE64)) { exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP "Glaneur.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
            Sort-Object FullName -Descending | Select-Object -First 1
          if ($null -eq $signtool) { throw "signtool.exe was not found on the runner." }
          $installer = Get-ChildItem "build\Output\Glaneur-*-setup.exe" | Select-Object -First 1
          if ($null -eq $installer) { throw "The Windows installer was not found." }
          & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfx /p $env:WINDOWS_PFX_PASSWORD $installer.FullName
          Remove-Item $pfx -Force
      - name: Generate Windows checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem "build\Output\Glaneur-*-setup.exe" | Select-Object -First 1
          if ($null -eq $installer) { throw "The Windows installer was not found." }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content "$($installer.FullName).sha256" -NoNewline
      - uses: actions/upload-artifact@v7
        with:
          name: Glaneur-setup
          path: build/Output/*

