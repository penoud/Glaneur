name: builds
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller build\WpImageDownloader.spec --noconfirm --clean
      - run: choco install innosetup --no-progress -y
      - run: iscc build\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: WpImagerDownloader-setup
          path: build/Output/*.exe

  linux:
    runs-on: ubuntu-22.04
    env:
      FLATPAK_USER_DIR: ${{ runner.temp }}/flatpak-user
      XDG_DATA_HOME: ${{ runner.temp }}/xdg-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build application bundle
        run: python -m PyInstaller build/WpImageDownloader.spec --noconfirm --clean
      - name: Build Debian package
        run: |
          chmod +x packaging/linux/build-deb.sh packaging/linux/WpImageDownloader-launcher
          packaging/linux/build-deb.sh "${GITHUB_REF_NAME#v}"
      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          mkdir -p "$FLATPAK_USER_DIR" "$XDG_DATA_HOME"
          flatpak --user remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak --user install -y flathub org.freedesktop.Sdk//24.08 org.freedesktop.Platform//24.08
      - name: Build Flatpak bundle
        run: |
          flatpak-builder --user --disable-rofiles-fuse --force-clean \
            flatpak-build packaging/linux/org.wpimagedownloader.WpImageDownloader.yml
          flatpak build-bundle "$FLATPAK_USER_DIR/repo" \
            "dist/WpImageDownloader-${GITHUB_REF_NAME#v}.flatpak" \
            org.wpimagedownloader.WpImageDownloader
      - uses: actions/upload-artifact@v4
        with:
          name: WpImageDownloader-linux
          path: |
            dist/*.deb
            dist/*.flatpak

  macos:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build macOS application
        run: python -m PyInstaller build/WpImageDownloader-macos.spec --noconfirm --clean
      - name: Create macOS archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          ditto -c -k --sequesterRsrc --keepParent \
            dist/WpImageDownloader.app "dist/WpImageDownloader-${VERSION}-macos.zip"
          hdiutil create -volname "WP Image Downloader" -srcfolder \
            dist/WpImageDownloader.app -ov -format UDZO \
            "dist/WpImageDownloader-${VERSION}-macos.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: WpImageDownloader-macos
          path: |
            dist/*.zip
            dist/*.dmg
